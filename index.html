<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Engy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --profile-img: url("https://img.alfrsantv.com/img/f176543888491621.png");
  --cover-img: url("https://img.alfrsantv.com/img/cover.jpg"); /* ← حطي صورة الغلاف هنا */
}

*{
  box-sizing:border-box;
  font-family:'Cairo', sans-serif;
}

body{
  margin:0;
  background:#f0f2f5;
}

/* ===== الغلاف ===== */
.cover{
  height:220px;
  background-image:var(--cover-img);
  background-size:cover;
  background-position:center;
}

/* ===== صندوق البروفايل ===== */
.profile-box{
  max-width:900px;
  margin:20px auto;
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
  text-align:right;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:20px;
}

.avatar{
  width:140px;
  height:140px;
  border-radius:50%;
  border:5px solid #fff;
  object-fit:cover;
  background-image:var(--profile-img);
  background-size:cover;
  background-position:center;
}

.profile-info{
  flex:1;
}

.name{
  font-size:28px;
  font-weight:700;
  color:#333;
}

.bio{
  color:#777;
  margin-top:5px;
}

/* ===== البوستات ===== */
.posts{
  max-width:900px;
  margin:30px auto;
}

.post{
  background:#fff;
  border-radius:18px;
  padding:15px;
  margin-bottom:20px;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background-image:var(--profile-img);
  background-size:cover;
  background-position:center;
}

.post-meta{
  flex:1;
}

.post-name{
  font-weight:700;
  color:#333;
}

.post-time{
  color:#888;
  font-size:13px;
}

.post-text{
  margin:10px 0;
  line-height:1.7;
  color:#444;
}

.post-img{
  width:100%;
  border-radius:15px;
  margin-top:10px;
  background-image:var(--profile-img);
  background-size:cover;
  background-position:center;
  height:300px;
}

/* ===== توثيق فيسبوك ===== */
.fb-verified{
  display:inline-block;
  width:18px;
  height:18px;
  margin-right:6px;
  background:#1877f2;
  border-radius:50%;
  position:relative;
  top:2px;
}

.fb-verified::after{
  content:"";
  position:absolute;
  left:5px;
  top:3px;
  width:4px;
  height:8px;
  border:solid #fff;
  border-width:0 2px 2px 0;
  transform:rotate(45deg);
}

/* ===== موبايل ===== */
@media(max-width:768px){
  .profile-top{
    flex-direction:column;
    text-align:center;
  }
}
</style>
</head>

<body>

<!-- الغلاف -->
<div class="cover"></div>

<!-- البروفايل -->
<div class="profile-box">
  <div class="profile-top">
    <div class="avatar"></div>
    <div class="profile-info">
      <div class="name">
        Ếᶇᶃƴ
        <span class="fb-verified" title="حساب موثّق"></span>
      </div>
      <div class="bio">أحب الهدوء، القهوة، والموسيقى 🎧💗</div>
    </div>
  </div>
</div>

<!-- البوستات -->
<div class="posts">

  <!-- بوست 1 -->
  <div class="post">
    <div class="post-header">
      <div class="post-avatar"></div>
      <div class="post-meta">
        <div class="post-name">Ếᶇᶃƴ</div>
        <div class="post-time">منذ ساعة</div>
      </div>
    </div>
    <div class="post-text">
      أحيانًا أبسط الأشياء هي اللي بتسعدنا أكتر 💭💗
    </div>
  </div>

  <!-- بوست 2 -->
  <div class="post">
    <div class="post-header">
      <div class="post-avatar"></div>
      <div class="post-meta">
        <div class="post-name">Ếᶇᶃƴ</div>
        <div class="post-time">أمس</div>
      </div>
    </div>
    <div class="post-text">
      مزاجي اليوم 🌸
    </div>
    <div class="post-img"></div>
  </div>

</div>

</body>
</html>
