<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engy | Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Tajawal', sans-serif;
}

body{
  background:linear-gradient(135deg,#ffe6f2,#e6f7ff);
  color:#333;
  overflow-x:hidden;
}

/* Scrollbar */
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:#f2f2f2;}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#ff8eb3,#a7c4ff);
  border-radius:10px;
}

/* Cover */
.cover{
  height:280px;
  background:linear-gradient(to bottom, rgba(255,255,255,0.3), rgba(0,0,0,0.2)), url('https://picsum.photos/1200/600') center/cover no-repeat;
  position:relative;
}

/* Profile Card */
.profile{
  max-width:920px;
  margin:-120px auto 40px;
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(15px);
  border-radius:30px;
  padding:35px;
  box-shadow:0 25px 60px rgba(0,0,0,.15);
  text-align:center;
  position:relative;
}

/* Avatar */
.avatar-wrap{
  display:flex;
  justify-content:center;
}

@keyframes glow {
  0% {box-shadow:0 0 15px rgba(255,140,180,0.6);}
  50% {box-shadow:0 0 30px rgba(255,140,180,0.9);}
  100% {box-shadow:0 0 15px rgba(255,140,180,0.6);}
}

.avatar{
  width:160px;
  height:160px;
  border-radius:50%;
  background:url('https://img.alfrsantv.com/img/f176882709321981.png') center/cover no-repeat;
  margin-top:-90px;
  border:6px solid #fff;
  animation:glow 2.5s infinite;
}

/* Name */
.profile h1{
  margin-top:15px;
  font-size:32px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.profile h1 i{
  color:#ff6fae;
}

/* Username */
.username{
  color:#888;
  margin:6px 0 15px;
}

/* Bio */
.bio{
  font-size:15px;
  line-height:1.8;
  color:#555;
  margin-bottom:25px;
}

/* Info Row */
.info{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:30px;
}

.info div{
  background:linear-gradient(135deg,#fff,#f7f7ff);
  border-radius:18px;
  padding:18px 10px;
  box-shadow:0 12px 28px rgba(0,0,0,.08);
  font-size:14px;
  transition:.3s;
}

.info div:hover{
  transform:translateY(-4px);
}

.info i{
  display:block;
  font-size:22px;
  color:#c58fff;
  margin-bottom:6px;
}

.info a{
  color:inherit;
  text-decoration:none;
}

.info a:active{
  text-decoration:underline;
}

/* Posts */
.posts{
  max-width:920px;
  margin:0 auto 70px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:25px;
}

.post{
  background:linear-gradient(145deg,#ffe6f2,#fbe9ff);
  border-radius:25px;
  padding:25px;
  box-shadow:0 20px 50px rgba(0,0,0,.12);
  transition:.35s;
}

.post:hover{
  transform:translateY(-6px);
  box-shadow:0 25px 60px rgba(0,0,0,.18);
}

.post span{
  font-size:13px;
  color:#ff6fae;
  font-weight:700;
}

.post h3{
  margin:10px 0;
  font-size:20px;
}

.post p{
  font-size:15px;
  color:#555;
  line-height:1.8;
}

/* Footer */
footer{
  text-align:center;
  padding:30px 10px;
  font-size:14px;
}

footer span{
  color:#ff6fae;
  font-weight:600;
}

footer a{
  color:#333;
  text-decoration:none;
  font-weight:700;
}

footer a:active{
  text-decoration:underline;
}

/* Mobile */
@media(max-width:600px){
  .profile{
    margin:-100px 15px 30px;
    padding:25px;
  }
  .info{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>
<body>

<div class="cover"></div>

<div class="profile">

  <div class="avatar-wrap">
    <div class="avatar"></div>
  </div>

  <h1>•Engy• <i class="fas fa-check-circle"></i></h1>
  <div class="username">@engy</div>

  <div class="bio">
    أنثوية، قوية، وملهمة… هذا أنا! 🌸
  </div>

  <div class="info">
    <div>
      <i class="fa-regular fa-face-smile"></i>
      المزاج<br><b>جيد</b>
    </div>
    <div>
      <i class="fa-solid fa-book"></i>
      الهواية<br><b>قراءة</b>
    </div>
    <div>
      <i class="fa-solid fa-palette"></i>
      اللون<br><b>لبني</b>
    </div>
    <div>
      <i class="fa-solid fa-comments"></i>
      دردشتي<br>
      <a href="https://xat.me/Melody" target="_blank"><b>ميلودى</b></a>
    </div>
  </div>

</div>

<div class="posts">

  <div class="post">
    <span>خواطر</span>
    <h3>قوتي</h3>
    <p>أنا قوية لأنني تعلمت كيف أبتسم رغم كل شيء.</p>
  </div>

  <div class="post">
    <span>إلهام</span>
    <h3>ثقتي</h3>
    <p>ثقتي بنفسي هي سر جمالي الحقيقي.</p>
  </div>

  <div class="post">
    <span>حياة</span>
    <h3>هدوئي</h3>
    <p>الهدوء لا يعني الضعف، بل يعني السلام الداخلي.</p>
  </div>

</div>

<footer>
  <span>برمجة وتطوير</span>
  <a href="https://xat.me/oOiiMahmoudiiOo" target="_blank">ζ͜͡Maђϻoud</a>
</footer>

</body>
</html>
