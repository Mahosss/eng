<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة شخصية راقية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&display=swap');

body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #fff0f5, #ffe4e1);
    color: #333;
    overflow-x: hidden;
}

/* ===== Hero Section ===== */
#hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    position: relative;
}

#hero::before, #hero::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    opacity: 0.2;
    animation: float 10s infinite alternate;
}

#hero::before {
    width: 350px;
    height: 350px;
    background: #f8bbd0;
    top: -50px;
    left: -80px;
}

#hero::after {
    width: 200px;
    height: 200px;
    background: #fce4ec;
    bottom: -50px;
    right: -50px;
}

@keyframes float {
    0% { transform: translateY(0) translateX(0); }
    100% { transform: translateY(30px) translateX(30px); }
}

#hero img {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 5px solid #fff;
    background-color: #ffe4e1;
    object-fit: cover;
    z-index: 1;
    transition: transform 0.5s;
}

#hero img:hover {
    transform: scale(1.05) rotate(2deg);
}

#hero h1 {
    font-family: 'Pacifico', cursive;
    font-size: 3rem;
    color: #c2185b;
    margin-top: 20px;
}

#hero p {
    font-size: 1.2rem;
    color: #880e4f;
    max-width: 600px;
    margin-top: 10px;
}

/* ===== About Section ===== */
#about {
    text-align: center;
    padding: 80px 20px;
}

#about h2 {
    font-family: 'Pacifico', cursive;
    font-size: 2.2rem;
    color: #c2185b;
    margin-bottom: 25px;
}

#about p {
    max-width: 650px;
    margin: auto;
    font-size: 1.1rem;
    line-height: 1.7;
    color: #5a2a46;
}

/* ===== Optional Decorative Shapes ===== */
.decor-shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.15;
    z-index: 0;
}

.decor-shape.one { width: 150px; height: 150px; background: #f8bbd0; top: 200px; left: -50px; }
.decor-shape.two { width: 100px; height: 100px; background: #fce4ec; bottom: 100px; right: -30px; }

/* ===== Footer ===== */
footer {
    text-align: center;
    padding: 20px;
    background: #f8bbd0;
    color: #880e4f;
    font-weight: bold;
}

@media(max-width:600px){
    #hero h1 { font-size: 2rem; }
    #hero p { font-size: 1rem; }
}
</style>
</head>
<body>

<section id="hero">
    <div class="decor-shape one"></div>
    <div class="decor-shape two"></div>
    <img alt="صورة شخصية" />
    <h1>اسمك هنا</h1>
    <p>جملة تعريفية تعبر عن شخصيتك بشكل أنيق وجذاب.</p>
</section>

<section id="about">
    <h2>عنّي</h2>
    <p>هذه فقرة قصيرة عن شخصيتك وهواياتك واهتماماتك، يمكن تعديلها لاحقًا لإضافة أي تفاصيل تحبينها.</p>
</section>

<footer>
    &copy; 2026 كل الحقوق محفوظة
</footer>

</body>
</html>
