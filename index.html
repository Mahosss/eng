<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>engy</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* Reset */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
body { background: #f0f2f5; color: #050505; }

/* Profile Container */
.profile-container { max-width: 1000px; margin: 20px auto; background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.15); background-image: url('https://images.unsplash.com/photo-1607746882042-944635dfe10e?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwxMTc3M3wwfDF8c2VhcmNofDF8fGNvdmVyJTIwcGhvdG98ZW58MHx8fHwxNjAxOTQwNjk3&ixlib=rb-4.0.3&q=80&w=1080'); background-size: cover; background-position: center; }

/* Cover Photo & Avatar */
.cover-photo { width: 100%; height: 250px; position: relative; }
.avatar { position: absolute; right: 30px; bottom: -60px; width: 120px; height: 120px; border-radius: 50%; border: 4px solid #fff; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.3); background: linear-gradient(135deg, #ff4fa6, #ff7ac8); }
.avatar img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
.avatar:hover img { transform: scale(1.2); }

/* Profile Header */
.profile-header { padding: 80px 30px 30px 30px; text-align: right; }
.profile-name { font-size: 26px; font-weight: bold; margin-bottom: 5px; background: linear-gradient(90deg, #ff7ac8, #fff, #ff7ac8); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 2.5s linear infinite; }
@keyframes shine { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.profile-desc { font-size: 16px; color: #333; margin-bottom: 20px; }

/* Tab Card */
.tab-card { background: rgba(255,255,255,0.9); padding: 20px; border-top: 1px solid #ddd; border-radius: 15px; backdrop-filter: blur(6px); }
.tabs { display: flex; gap: 20px; border-bottom: 1px solid #ddd; margin-bottom: 15px; }
.tab { cursor: pointer; padding: 10px 15px; font-weight: bold; color: #555; border-radius: 5px; transition: 0.3s; }
.tab.active { background: #e4e6eb; }
.tab:hover { background: #ddd; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Posts */
.post { background: #f0f2f5; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }
.post img { width: 100%; border-radius: 10px; margin-bottom: 10px; }

/* Photos Grid */
.image-grid { display: flex; gap: 10px; flex-wrap: wrap; }
.image-grid img { width: calc(33.33% - 6.66px); border-radius: 10px; }

/* Reels Grid - Vertical */
.reels-grid { display: flex; flex-direction: column; gap: 10px; max-height: 600px; overflow-y: auto; }
.reels-grid iframe { width: 100%; height: 400px; border-radius: 15px; border: none; }

/* Responsive */
@media (max-width: 768px) {
  .avatar { right: 20px; bottom: -50px; width: 100px; height: 100px; }
  .tab { padding: 8px 12px; font-size: 14px; }
  .reels-grid iframe { height: 250px; }
  .image-grid img { width: 100%; }
}
</style>
</head>
<body>
<div class="profile-container">
  <div class="cover-photo">
    <div class="avatar"><img src="https://img.alfrsantv.com/img/f176543888491621.png"></div>
  </div>
  <div class="profile-header">
    <div class="profile-name">𝗘𝑛𝚐𝑦</div>
    <div class="profile-desc">ومرة فى العمر يقف الإنسان بجوار أحدهم ولا يود التحرك حتى لوفاته العالم</div>
  </div>
  <div class="tab-card">
    <div class="tabs">
      <div class="tab active" data-tab="posts">المنشورات</div>
      <div class="tab" data-tab="photos">الصور</div>
      <div class="tab" data-tab="reels">ريلز</div>
    </div>
    <div class="tab-content active" id="posts">
      <div class="post">هذا هو المنشور الأول.</div>
      <div class="post">هذا هو المنشور الثاني.</div>
      <div class="post">هذا هو المنشور الثالث.</div>
    </div>
    <div class="tab-content" id="photos">
      <div class="image-grid">
        <img src="https://picsum.photos/300/200?1" />
        <img src="https://picsum.photos/300/200?2" />
        <img src="https://picsum.photos/300/200?3" />
      </div>
    </div>
    <div class="tab-content" id="reels">
      <div class="reels-grid">
        <iframe src="https://www.youtube.com/embed/DJfC7PTE0_0"></iframe>
        <iframe src="https://www.youtube.com/embed/IZGcNcxgPDI"></iframe>
        <iframe src="https://www.youtube.com/embed/sewClNjqGa8"></iframe>
        <iframe src="https://www.youtube.com/embed/0nURRcxaKXE"></iframe>
        <iframe src="https://www.youtube.com/embed/pPYlntArFqE"></iframe>
      </div>
    </div>
  </div>
</div>
<script>
const tabs = document.querySelectorAll('.tab');
const contents = document.querySelectorAll('.tab-content');
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    contents.forEach(c => c.classList.remove('active'));
    document.getElementById(tab.dataset.tab).classList.add('active');
  });
});
</script>
</body>
</html>
