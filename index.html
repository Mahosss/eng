<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Engy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  font-family:'Cairo', sans-serif;
}

body{
  margin:0;
  background:#f0f2f5;
}

.cover{
  height:260px;
  background:url("https://img.alfrsantv.com/img/f176759891637631.jpg") center/cover no-repeat;
  position:relative;
}

.cover::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.2),rgba(0,0,0,.5));
}

.profile-box{
  max-width:900px;
  margin:-90px auto 20px;
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  text-align:right;
  position:relative;
  z-index:2;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:20px;
}

.avatar{
  width:140px;
  height:140px;
  border-radius:50%;
  border:6px solid #fff;
  object-fit:cover;
}

.profile-info{
  flex:1;
}

.name{
  font-size:28px;
  font-weight:700;
  color:#333;
}

.bio{
  color:#777;
  margin-top:6px;
}

.fb-verified{
  display:inline-block;
  width:18px;
  height:18px;
  margin-right:6px;
  background:#1877f2;
  border-radius:50%;
  position:relative;
  top:2px;
}

.fb-verified::after{
  content:"";
  position:absolute;
  left:5px;
  top:3px;
  width:4px;
  height:8px;
  border:solid #fff;
  border-width:0 2px 2px 0;
  transform:rotate(45deg);
}

.posts{
  max-width:900px;
  margin:30px auto;
}

.post{
  background:#fff;
  border-radius:18px;
  padding:15px;
  margin-bottom:20px;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-header img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

.post-meta{
  flex:1;
}

.post-name{
  font-weight:700;
  color:#333;
}

.post-time{
  color:#888;
  font-size:13px;
}

.post-text{
  margin:10px 0;
  line-height:1.7;
  color:#444;
}

.post img.post-img{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}

@media(max-width:768px){
  .profile-top{
    flex-direction:column;
    text-align:center;
  }
}
</style>
</head>

<body>

<div class="cover"></div>

<div class="profile-box">
  <div class="profile-top">
    <img id="profileAvatar" class="avatar"
         src="https://img.alfrsantv.com/img/f176543888491621.png">
    <div class="profile-info">
      <div class="name">
        Ếᶇᶃƴ
        <span class="fb-verified" title="حساب موثّق"></span>
      </div>
      <div class="bio">أحب الاكل، العصائر، والنوم 🎧💗</div>
    </div>
  </div>
</div>

<div class="posts">

  <div class="post">
    <div class="post-header">
      <img class="post-avatar">
      <div class="post-meta">
        <div class="post-name">Ếᶇᶃƴ</div>
        <div class="post-time">منذ ساعة</div>
      </div>
    </div>
    <div class="post-text">
      أحيانًا أبسط الأشياء هي اللي بتسعدنا أكتر 💭💗
    </div>
  </div>

  <div class="post">
    <div class="post-header">
      <img class="post-avatar">
      <div class="post-meta">
        <div class="post-name">Ếᶇᶃƴ</div>
        <div class="post-time">أمس</div>
      </div>
    </div>
    <div class="post-text">
      مزاجي اليوم 🌸
    </div>
    <img class="post-img post-avatar">
  </div>

</div>

<script>
const avatarSrc = document.getElementById("profileAvatar").src;
document.querySelectorAll(".post-avatar").forEach(img=>{
  img.src = avatarSrc;
});
</script>

</body>
</html>
