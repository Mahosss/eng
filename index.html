<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة شخصية أنثوية</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&display=swap');

    /* ===== Reset ===== */
    * { margin:0; padding:0; box-sizing:border-box; }

    body { font-family: 'Cairo', sans-serif; background: #fff0f5; color: #333; }

    a { text-decoration: none; color: inherit; }

    section { padding: 80px 20px; }

    h1, h2 { margin-bottom: 20px; }

    /* ===== Hero Section ===== */
    #hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: linear-gradient(135deg, #f8bbd0, #fce4ec);
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    #hero::before {
        content: '';
        position: absolute;
        width: 300px;
        height: 300px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        top: -50px;
        left: -50px;
        animation: float 6s ease-in-out infinite alternate;
    }

    @keyframes float {
        0% { transform: translate(0,0); }
        100% { transform: translate(50px,50px); }
    }

    #hero img {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        border: 5px solid #fff;
        background-color: #ffe4e1;
        margin-bottom: 20px;
    }

    #hero h1 {
        font-family: 'Pacifico', cursive;
        font-size: 3rem;
        color: #c2185b;
    }

    #hero p {
        font-size: 1.2rem;
        color: #880e4f;
    }

    /* ===== About Section ===== */
    #about {
        background: #fff5f8;
        text-align: center;
    }

    #about p {
        max-width: 650px;
        margin: auto;
        font-size: 1.1rem;
        line-height: 1.6;
    }

    /* ===== Portfolio Section ===== */
    #portfolio {
        background: #fce4ec;
        text-align: center;
    }

    .portfolio-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin-top: 30px;
    }

    .portfolio-item {
        background: #fff;
        width: 220px;
        height: 180px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: #c2185b;
        font-size: 1rem;
        transition: transform 0.3s, box-shadow 0.3s;
        cursor: pointer;
    }

    .portfolio-item:hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    /* ===== Contact Section ===== */
    #contact {
        background: #fff5f8;
        text-align: center;
    }

    #contact form {
        max-width: 450px;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    #contact input, #contact textarea {
        padding: 12px;
        border: 1px solid #c2185b;
        border-radius: 10px;
        font-size: 1rem;
    }

    #contact button {
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #c2185b;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
    }

    #contact button:hover {
        background: #880e4f;
    }

    /* ===== Footer ===== */
    footer {
        text-align: center;
        padding: 25px;
        background: #f8bbd0;
        color: #880e4f;
        font-weight: bold;
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px){
        #hero h1 { font-size: 2.2rem; }
        #hero p { font-size: 1rem; }
        .portfolio-item { width: 100%; max-width: 300px; }
    }
</style>
</head>
<body>

<!-- Hero Section -->
<section id="hero">
    <img alt="صورة شخصية" />
    <h1>اسمك هنا</h1>
    <p>جملة تعريفية جذابة عنك</p>
</section>

<!-- About Section -->
<section id="about">
    <h2>عنّي</h2>
    <p>هنا يمكنك كتابة فقرة قصيرة عنك، هواياتك، مهاراتك، وما تحبين تقديمه للزائر بطريقة جذابة وأنيقة.</p>
</section>

<!-- Portfolio Section -->
<section id="portfolio">
    <h2>معرض أعمالي</h2>
    <div class="portfolio-grid">
        <div class="portfolio-item">مشروع 1</div>
        <div class="portfolio-item">مشروع 2</div>
        <div class="portfolio-item">مشروع 3</div>
        <div class="portfolio-item">مشروع 4</div>
    </div>
</section>

<!-- Contact Section -->
<section id="contact">
    <h2>تواصل معي</h2>
    <form>
        <input type="text" placeholder="الاسم" required>
        <input type="email" placeholder="البريد الإلكتروني" required>
        <textarea placeholder="رسالتك" rows="5" required></textarea>
        <button type="submit">إرسال</button>
    </form>
</section>

<!-- Footer -->
<footer>
    &copy; 2026 كل الحقوق محفوظة
</footer>

</body>
</html>
