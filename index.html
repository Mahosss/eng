<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bear Cute Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(to bottom,#e8cfc5,#e3beb3);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

/* الكارت الرئيسي */
.container{
width:390px;
background:#f3d8cc;
border-radius:35px;
padding:25px;
box-shadow:0 25px 50px rgba(0,0,0,.15);
text-align:center;
position:relative;
overflow:hidden;
}

/* خطوط خلفية */
.container::before{
content:"";
position:absolute;
inset:0;
background:repeating-linear-gradient(
to right,
rgba(255,255,255,0.25) 0px,
rgba(255,255,255,0.25) 6px,
transparent 6px,
transparent 60px
);
opacity:.4;
}

/* ================= */
/* الدبدوب */
.bear-wrapper{
position:relative;
width:260px;
margin:0 auto 25px;
}

.bear{
width:260px;
height:220px;
background:radial-gradient(circle at 40% 30%, #9b6a5f, #7d4f45);
border-radius:140px 140px 110px 110px;
position:relative;
box-shadow:
inset -15px -15px 25px rgba(0,0,0,.25),
inset 10px 10px 25px rgba(255,255,255,.1);
}

.ear{
width:85px;
height:85px;
background:radial-gradient(circle,#9b6a5f,#7d4f45);
border-radius:50%;
position:absolute;
top:-35px;
box-shadow:inset -8px -8px 15px rgba(0,0,0,.2);
}

.ear.left{left:-15px;}
.ear.right{right:-15px;}

.eye{
width:16px;
height:16px;
background:#111;
border-radius:50%;
position:absolute;
top:95px;
box-shadow:0 0 5px rgba(255,255,255,.6);
}

.eye.left{left:85px;}
.eye.right{right:85px;}

.cheek{
width:55px;
height:55px;
background:radial-gradient(circle,#f48b8b,#d35c5c);
border-radius:50%;
position:absolute;
top:110px;
opacity:.95;
box-shadow:inset -5px -5px 10px rgba(0,0,0,.15);
}

.cheek.left{left:45px;}
.cheek.right{right:45px;}

.snout{
width:110px;
height:85px;
background:radial-gradient(circle,#d8b2a3,#c79c8d);
border-radius:50px;
position:absolute;
top:110px;
left:50%;
transform:translateX(-50%);
box-shadow:inset -6px -6px 12px rgba(0,0,0,.15);
}

.nose{
width:25px;
height:18px;
background:#5c3a32;
border-radius:50%;
margin:25px auto 0;
}

.bow{
width:70px;
height:35px;
background:linear-gradient(to right,#e3a2a0,#c98280);
border-radius:30px;
position:absolute;
bottom:-20px;
left:50%;
transform:translateX(-50%);
box-shadow:inset -5px -5px 10px rgba(0,0,0,.15);
}

/* الكريمة */
.cream{
position:absolute;
bottom:-5px;
left:0;
width:100%;
height:50px;
background:#fff;
border-radius:0 0 50px 50px;
box-shadow:0 8px 15px rgba(0,0,0,.1);
}

/* ================= */
/* الساعة الرقمية */
.time{
font-size:48px;
font-weight:700;
color:#6a463d;
margin-top:15px;
}

.date{
color:#6a463d;
opacity:.8;
margin-bottom:15px;
}

/* الساعة الدائرية */
.clock{
width:120px;
height:120px;
background:#f6e6dc;
border-radius:50%;
margin:15px auto;
position:relative;
box-shadow:
inset -6px -6px 15px rgba(0,0,0,.15),
inset 6px 6px 15px rgba(255,255,255,.6);
}

.hand{
position:absolute;
bottom:50%;
left:50%;
transform-origin:bottom;
background:#8b5e52;
}

.hour{
width:6px;
height:30px;
}

.minute{
width:4px;
height:45px;
}

.second{
width:2px;
height:50px;
background:#d79b95;
}

/* أيقونات */
.icons{
display:flex;
justify-content:space-between;
margin-top:20px;
}

.icon{
width:60px;
height:60px;
background:#8b5e52;
border-radius:18px;
box-shadow:
inset -5px -5px 12px rgba(0,0,0,.2),
inset 5px 5px 12px rgba(255,255,255,.15);
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:22px;
cursor:pointer;
transition:.3s;
}

.icon:hover{
transform:translateY(-6px);
}
</style>
</head>
<body>

<div class="container">

<div class="bear-wrapper">
<div class="bear">
<div class="ear left"></div>
<div class="ear right"></div>
<div class="cheek left"></div>
<div class="cheek right"></div>
<div class="eye left"></div>
<div class="eye right"></div>
<div class="snout">
<div class="nose"></div>
</div>
<div class="bow"></div>
</div>
<div class="cream"></div>
</div>

<div class="time" id="digitalClock"></div>
<div class="date" id="date"></div>

<div class="clock">
<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>
</div>

<div class="icons">
<div class="icon">🐻</div>
<div class="icon">🍓</div>
<div class="icon">❤️</div>
<div class="icon">⭐</div>
</div>

</div>

<script>
function updateClock(){
const now=new Date();
const h=now.getHours();
const m=now.getMinutes();
const s=now.getSeconds();

document.getElementById("digitalClock").innerHTML=
String(h).padStart(2,'0')+":"+String(m).padStart(2,'0');

document.getElementById("date").innerHTML=
now.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"numeric"});

document.getElementById("hour").style.transform=
"translateX(-50%) rotate("+(h*30+m/2)+"deg)";
document.getElementById("minute").style.transform=
"translateX(-50%) rotate("+(m*6)+"deg)";
document.getElementById("second").style.transform=
"translateX(-50%) rotate("+(s*6)+"deg)";
}
setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
