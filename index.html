<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engy Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">

<style>
:root{
--plate-color:#ffffff; /* تقدر تغير اللون من هنا */
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(to bottom,#e9cfc4,#e4c1b6);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:420px;
height:750px;
background:#f3d8cc;
border-radius:40px;
position:relative;
overflow:hidden;
box-shadow:0 30px 60px rgba(0,0,0,.15);
padding-top:40px;
text-align:center;
}

/* صورة الدبدوب الأصلية */
.bear-container{
position:relative;
width:100%;
z-index:2;
}

.bear-container img{
width:340px;
display:block;
margin:0 auto;
}

/* اللوح تحت ايدين الدبدوب */
.plate{
position:absolute;
bottom:210px;  /* تم ضبطها لتكون تحت الايدين */
left:50%;
transform:translateX(-50%);
width:300px;
height:95px;
background:var(--plate-color);
border-radius:50px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:bold;
color:#6b463d;
box-shadow:0 15px 30px rgba(0,0,0,.15);
z-index:1;
}

/* الساعة */
.time{
position:absolute;
bottom:110px;
left:50%;
transform:translateX(-50%);
font-size:48px;
color:#6b463d;
font-weight:bold;
}

.date{
position:absolute;
bottom:80px;
left:50%;
transform:translateX(-50%);
color:#6b463d;
opacity:.8;
font-size:14px;
}
</style>
</head>
<body>

<div class="card">

<div class="bear-container">
<img src="bear.png" alt="Bear">
</div>

<div class="plate">Engy</div>

<div class="time" id="clock"></div>
<div class="date" id="date"></div>

</div>

<script>
function updateClock(){
const now=new Date();

document.getElementById("clock").innerHTML =
now.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});

document.getElementById("date").innerHTML =
now.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
}

setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
