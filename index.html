<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الصفحة الشخصية</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  font-family:'Cairo', sans-serif;
}

body{
  margin:0;
  background:#f0f2f5;
}

/* ===== الغلاف ===== */
.cover{
  height:200px;
  background:linear-gradient(135deg,#f7e8ff,#ffd9ef);
}

/* ===== صندوق البروفايل ===== */
.profile-box{
  max-width:900px;
  margin:20px auto;
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
  text-align:right;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:20px;
}

.avatar{
  width:140px;
  height:140px;
  border-radius:50%;
  border:5px solid #f7e8ff;
  object-fit:cover;
}

.profile-info{
  flex:1;
}

.name{
  font-size:28px;
  font-weight:700;
  color:#333;
}

.bio{
  color:#777;
  margin-top:5px;
}

/* ===== البوستات ===== */
.posts{
  max-width:900px;
  margin:30px auto;
}

.post{
  background:#fff;
  border-radius:18px;
  padding:15px;
  margin-bottom:20px;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-header img{
  width:45px;
  height:45px;
  border-radius:50%;
}

.post-meta{
  flex:1;
}

.post-name{
  font-weight:700;
  color:#333;
}

.post-time{
  color:#888;
  font-size:13px;
}

.post-text{
  margin:10px 0;
  line-height:1.7;
  color:#444;
}

.post img.post-img{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}

/* ===== موبايل ===== */
@media(max-width:768px){
  .profile-top{
    flex-direction:column;
    text-align:center;
  }
}
</style>
</head>

<body>

<!-- الغلاف -->
<div class="cover"></div>

<!-- البروفايل -->
<div class="profile-box">
  <div class="profile-top">
    <img class="avatar" src="https://i.imgur.com/6VBx3io.jpg">
    <div class="profile-info">
      <div class="name">لونا ✨</div>
      <div class="bio">أحب الهدوء، القهوة، والموسيقى 🎧💗</div>
    </div>
  </div>
</div>

<!-- البوستات -->
<div class="posts">

  <!-- بوست 1 -->
  <div class="post">
    <div class="post-header">
      <img src="https://i.imgur.com/6VBx3io.jpg">
      <div class="post-meta">
        <div class="post-name">لونا</div>
        <div class="post-time">منذ ساعة</div>
      </div>
    </div>
    <div class="post-text">
      أحيانًا أبسط الأشياء هي اللي بتسعدنا أكتر 💭💗
    </div>
  </div>

  <!-- بوست 2 -->
  <div class="post">
    <div class="post-header">
      <img src="https://i.imgur.com/6VBx3io.jpg">
      <div class="post-meta">
        <div class="post-name">لونا</div>
        <div class="post-time">أمس</div>
      </div>
    </div>
    <div class="post-text">
      مزاجي اليوم 🌸
    </div>
    <img class="post-img" src="https://picsum.photos/600/400?girl">
  </div>

</div>

</body>
</html>
