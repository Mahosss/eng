<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engy</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Tajawal', sans-serif;
}

/* Scrollbar */
::-webkit-scrollbar{width:7px;}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#ff9acb,#bfa7ff);
  border-radius:10px;
}
::-webkit-scrollbar-track{background:#0f0f16;}

body{
  min-height:100vh;
  background:radial-gradient(circle at top left,#1a1a2e,#0f0f16 60%);
  color:#fff;
  overflow-x:hidden;
}

/* Animated background glow */
.glow{
  position:fixed;
  width:400px;
  height:400px;
  background:radial-gradient(circle,#ff9acb55,transparent 70%);
  filter:blur(80px);
  top:-100px;
  right:-100px;
  animation:float 10s infinite alternate;
  z-index:0;
}
@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(80px);}
}

/* Container */
.container{
  position:relative;
  z-index:2;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:40px 20px;
  max-width:900px;
  margin:auto;
}

/* Name */
.name{
  font-size:42px;
  font-weight:700;
  letter-spacing:2px;
  margin-bottom:10px;
}

/* Mood */
.mood{
  font-size:18px;
  color:#ff9acb;
  margin-bottom:40px;
}

/* Thoughts */
.thought{
  font-size:22px;
  line-height:1.9;
  margin-bottom:30px;
  opacity:0;
  transform:translateY(30px);
  animation:reveal 1s forwards;
}

.thought:nth-child(3){animation-delay:.3s;}
.thought:nth-child(4){animation-delay:.6s;}
.thought:nth-child(5){animation-delay:.9s;}

@keyframes reveal{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* Footer */
footer{
  margin-top:60px;
  font-size:14px;
  color:#aaa;
}

footer span{
  color:#ff9acb;
}

footer a{
  color:#fff;
  text-decoration:none;
  border-bottom:1px dotted #ff9acb;
}

/* Mobile */
@media(max-width:600px){
  .name{font-size:32px;}
  .thought{font-size:18px;}
}
</style>
</head>
<body>

<div class="glow"></div>

<div class="container">

  <div class="name">Engy</div>
  <div class="mood">مزاج اليوم: هادئة ✨</div>

  <div class="thought">
    أحيانًا لا أحتاج أن أتكلم…  
    يكفيني أن أشعر.
  </div>

  <div class="thought">
    الهدوء ليس فراغًا،  
    بل امتلاء لا يُشرح.
  </div>

  <div class="thought">
    أنا بخير،  
    حتى لو لم يبدو ذلك واضحًا.
  </div>

  <footer>
    <span>برمجة وتطوير</span>
    <a href="https://xat.me/oOiiMahmoudiiOo" target="_blank">Mahmoud</a>
  </footer>

</div>

</body>
</html>
