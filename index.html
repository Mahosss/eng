<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Engy</title>
    <style>
        body {
            background: radial-gradient(circle at center, #1b0229, #050505);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
        }

        /* حاوية بروفايل خيالية: شكل غير منتظم (Blob) */
        .magic-card {
            width: 350px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; /* شكل عشوائي خيالي */
            text-align: center;
            position: relative;
            box-shadow: 0 0 50px rgba(188, 19, 254, 0.3);
            animation: morphing 8s infinite alternate;
        }

        @keyframes morphing {
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            100% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
        }

        /* دائرة الصورة مع توهج ملون */
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0 20px #bc13fe, 0 0 40px #bc13fe;
            margin-bottom: 20px;
            transition: 0.5s;
        }

        .avatar:hover { transform: scale(1.1) rotate(10deg); }

        h1 {
            font-size: 2.5rem;
            text-shadow: 0 0 10px #fff, 0 0 20px #bc13fe;
            letter-spacing: 2px;
        }

        .bio {
            color: #d1d1d1;
            font-style: italic;
            margin-top: 10px;
        }

        /* نجوم متلألئة في الخلفية */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- نجوم عشوائية -->
    <div class="star" style="top: 20%; left: 20%;"></div>
    <div class="star" style="top: 70%; left: 80%;"></div>
    <div class="star" style="top: 40%; left: 60%;"></div>

    <div class="magic-card">
        <img src="https://xatimg.com/image/YqjKEtyM2jfU.jpg" class="avatar" alt="Angy">
        <h1>Angy</h1>
        <p class="bio">"روح تعيش بين النجوم، وخيال لا يعرف الحدود.."</p>
    </div>

</body>
</html>
