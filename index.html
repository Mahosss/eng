<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة شخصية</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&display=swap');

    body {
        margin: 0;
        font-family: 'Cairo', sans-serif;
        background: #fff0f5;
        color: #333;
    }

    a { text-decoration: none; color: inherit; }

    section { padding: 80px 20px; }

    h1,h2 { margin-bottom: 20px; }

    /* ===== Hero ===== */
    #hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        background: linear-gradient(135deg, #fce4ec, #f8bbd0);
    }

    #hero img {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background-color: #ffe4e1;
        margin-bottom: 20px;
        border: 5px solid #fff;
    }

    #hero h1 {
        font-family: 'Pacifico', cursive;
        font-size: 3rem;
        color: #c2185b;
    }

    #hero p {
        font-size: 1.2rem;
        color: #880e4f;
        max-width: 600px;
    }

    /* ===== About ===== */
    #about {
        text-align: center;
        background: #fff5f8;
    }

    #about p {
        max-width: 700px;
        margin: auto;
        font-size: 1.1rem;
        line-height: 1.6;
    }

    /* ===== Optional Section for Photos or Hobbies ===== */
    #hobbies {
        background: #fce4ec;
        text-align: center;
    }

    .hobby-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
    }

    .hobby-item {
        width: 150px;
        height: 150px;
        border-radius: 20px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #c2185b;
        font-weight: bold;
        font-size: 1rem;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .hobby-item:hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    /* ===== Footer ===== */
    footer {
        text-align: center;
        padding: 20px;
        background: #f8bbd0;
        color: #880e4f;
        font-weight: bold;
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px){
        #hero h1 { font-size: 2.2rem; }
        #hero p { font-size: 1rem; }
        .hobby-item { width: 100%; max-width: 250px; }
    }
</style>
</head>
<body>

<!-- Hero Section -->
<section id="hero">
    <img alt="صورة شخصية" />
    <h1>اسمك هنا</h1>
    <p>جملة قصيرة عن شخصيتك أو ما تحبين تعريف الزائر عنك به.</p>
</section>

<!-- About Section -->
<section id="about">
    <h2>عنّي</h2>
    <p>فقرة قصيرة تكتب فيها عن نفسك، اهتماماتك، هواياتك، وما تحبين أن يعرفه عنك الزائر.</p>
</section>

<!-- Optional Hobbies / Moments Section -->
<section id="hobbies">
    <h2>هواياتي / لحظاتي</h2>
    <div class="hobby-grid">
        <div class="hobby-item">هواية 1</div>
        <div class="hobby-item">هواية 2</div>
        <div class="hobby-item">هواية 3</div>
        <div class="hobby-item">هواية 4</div>
    </div>
</section>

<!-- Footer -->
<footer>
    &copy; 2026 كل الحقوق محفوظة
</footer>

</body>
</html>
