<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bear UI</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial;
}

body{
  background:#e8c7b7;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* container */
.app{
  width:350px;
  background:#e8c7b7;
  padding:20px;
  border-radius:25px;
}

/* bear */
.bear{
  width:100%;
  border-radius:20px;
}

/* cream */
.cream{
  background:#fff;
  height:60px;
  border-radius:30px 30px 20px 20px;
  margin-top:-20px;
  box-shadow: inset 0 5px 10px rgba(0,0,0,0.1);
}

/* time */
.time{
  font-size:40px;
  font-weight:bold;
  color:#5b3b2f;
  text-align:center;
  margin-top:10px;
}

.date{
  text-align:center;
  color:#5b3b2f;
}

/* clock */
.clock{
  width:130px;
  height:130px;
  border-radius:50%;
  margin:20px auto;
  background:#f3d7c8;
  box-shadow: 8px 8px 15px #caa999,
              -8px -8px 15px #fff;
  position:relative;
}

.hand{
  position:absolute;
  bottom:50%;
  left:50%;
  transform-origin:bottom;
  background:#5b3b2f;
}

.hour{width:5px;height:30px;}
.min{width:3px;height:40px;}
.sec{width:2px;height:50px;background:red;}

/* cards */
.cards{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.card{
  width:60px;
  height:60px;
  border-radius:15px;
  background:#f3d7c8;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  box-shadow: 5px 5px 10px #caa999,
              -5px -5px 10px #fff;
}
</style>
</head>

<body>

<div class="app">

  <!-- bear -->
  <img src="bear.jpg" class="bear">

  <div class="cream"></div>

  <!-- time -->
  <div class="time" id="time">00:00</div>
  <div class="date" id="date"></div>

  <!-- clock -->
  <div class="clock">
    <div class="hand hour" id="h"></div>
    <div class="hand min" id="m"></div>
    <div class="hand sec" id="s"></div>
  </div>

  <!-- icons -->
  <div class="cards">
    <div class="card">🐻</div>
    <div class="card">🍓</div>
    <div class="card">🎀</div>
    <div class="card">❤️</div>
  </div>

</div>

<script>
function update(){
  let d=new Date();

  let h=d.getHours();
  let m=d.getMinutes();
  let s=d.getSeconds();

  document.getElementById("time").innerText =
    String(h).padStart(2,'0')+":"+String(m).padStart(2,'0');

  document.getElementById("date").innerText = d.toDateString();

  document.getElementById("h").style.transform =
    "rotate("+(h*30+m/2)+"deg)";
  document.getElementById("m").style.transform =
    "rotate("+(m*6)+"deg)";
  document.getElementById("s").style.transform =
    "rotate("+(s*6)+"deg)";
}

setInterval(update,1000);
update();
</script>

</body>
</html>
