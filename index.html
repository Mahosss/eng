<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bear UI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #f4d6c8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* الكارد */
.card {
    width: 340px;
    padding: 20px;
    border-radius: 30px;
    background: #f6d8cb;
    box-shadow: 15px 15px 30px #e0bfb1,
                -15px -15px 30px #fff2ea;
    text-align: center;
}

/* صورة الدب */
.bear-img {
    width: 200px;
    margin-top: -40px;
    transition: 0.3s;
}

/* حركة */
.bear-img:hover {
    transform: scale(1.05) rotate(2deg);
}

/* الوقت */
.time {
    font-size: 45px;
    font-weight: 600;
    margin-top: 10px;
    color: #6b4c45;
}

/* التاريخ */
.date {
    color: #8c6d65;
}

/* الأزرار */
.buttons {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
}

.btn {
    width: 55px;
    height: 55px;
    border-radius: 18px;
    background: #7b5e57;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 20px;
    box-shadow: 6px 6px 12px #6a4f49,
                -6px -6px 12px #8c6d65;
    cursor: pointer;
    transition: 0.2s;
}

.btn:active {
    transform: scale(0.9);
}

/* footer */
.footer {
    margin-top: 15px;
    padding: 10px;
    border-radius: 15px;
    background: #7b5e57;
    color: white;
}
</style>
</head>

<body>

<div class="card">

    <img src="bear.png" class="bear-img" id="bear">

    <div class="time" id="time"></div>
    <div class="date" id="date"></div>

    <div class="buttons">
        <div class="btn">🏠</div>
        <div class="btn">📷</div>
        <div class="btn">🔒</div>
        <div class="btn">⚙️</div>
    </div>

    <div class="footer">Yummy 🍰</div>

</div>

<script>
// الساعة
function updateTime() {
    const now = new Date();

    let h = now.getHours().toString().padStart(2, '0');
    let m = now.getMinutes().toString().padStart(2, '0');

    document.getElementById("time").innerText = h + ":" + m;

    const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    let day = days[now.getDay()];
    let date = now.getDate().toString().padStart(2, '0');
    let month = (now.getMonth()+1).toString().padStart(2, '0');

    document.getElementById("date").innerText = `${date}/${month} - ${day}`;
}

setInterval(updateTime, 1000);
updateTime();


// حركة عند الضغط
const bear = document.getElementById("bear");

bear.addEventListener("click", () => {
    bear.style.transform = "scale(1.1) rotate(-5deg)";
    setTimeout(() => {
        bear.style.transform = "";
    }, 300);
});
</script>

</body>
</html>
