<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noha</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Tajawal', sans-serif;
}

/* Scroll */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#f2a7c6,#c8b6ff);
  border-radius:10px;
}
::-webkit-scrollbar-track{background:#faf7fb;}

body{
  min-height:100vh;
  background:radial-gradient(circle at top,#fff,#f7f1f6 70%);
  color:#333;
}

/* Soft glow */
.glow{
  position:fixed;
  width:350px;
  height:350px;
  background:radial-gradient(circle,#f2a7c655,transparent 70%);
  filter:blur(90px);
  top:-120px;
  left:-120px;
  z-index:0;
}

/* Main */
.main{
  position:relative;
  z-index:2;
  max-width:800px;
  margin:auto;
  padding:80px 20px 60px;
}

/* Name */
.name{
  font-size:40px;
  font-weight:600;
  letter-spacing:2px;
  margin-bottom:10px;
}

/* Subtitle */
.subtitle{
  font-size:16px;
  color:#b48ead;
  margin-bottom:50px;
}

/* Lines */
.line{
  font-size:22px;
  line-height:2;
  margin-bottom:35px;
  opacity:0;
  transform:translateY(30px);
  animation:fadeUp 1s forwards;
}

.line:nth-child(3){animation-delay:.3s;}
.line:nth-child(4){animation-delay:.6s;}
.line:nth-child(5){animation-delay:.9s;}

@keyframes fadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* Footer */
footer{
  margin-top:70px;
  font-size:14px;
  color:#999;
}

footer span{
  color:#f2a7c6;
}

footer a{
  color:#333;
  text-decoration:none;
  border-bottom:1px dotted #f2a7c6;
}

/* Mobile */
@media(max-width:600px){
  .name{font-size:30px;}
  .line{font-size:18px;}
}
</style>
</head>
<body>

<div class="glow"></div>

<div class="main">

  <div class="name">Noha</div>
  <div class="subtitle">أنا بخير… بطريقتي 🌷</div>

  <div class="line">
    لا أحب الضجيج،  
    أحب كل ما يشبه السلام.
  </div>

  <div class="line">
    أنثى هادئة،  
    لكن قلبي يعرف كيف يكون قويًا.
  </div>

  <div class="line">
    أختار نفسي دائمًا،  
    حتى في أبسط التفاصيل.
  </div>

  <footer>
    <span>برمجة وتطوير</span>
    <a href="https://xat.me/oOiiMahmoudiiOo" target="_blank">Mahmoud</a>
  </footer>

</div>

</body>
</html>
