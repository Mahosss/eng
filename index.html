<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Engy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: radial-gradient(circle at center, #1b0229, #050505); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            color: #fff; 
            font-family: 'Tajawal', sans-serif; 
            margin: 0; 
        }

        /* --- تأثير النجوم المتلألئة --- */
        .star {
            position: absolute;
            width: 3px; height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
            pointer-events: none;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* --- الكارت الخيالي --- */
        .magic-card { 
            width: 350px; 
            padding: 40px; 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; 
            text-align: center; 
            position: relative; 
            z-index: 2;
            box-shadow: 0 0 50px rgba(188, 19, 254, 0.3); 
            animation: morphing 8s infinite alternate; 
        }

        @keyframes morphing { 
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; } 
            100% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; } 
        }

        /* --- الصورة --- */
        .avatar-wrapper { display: inline-block; transition: 0.5s; cursor: pointer; }
        .avatar { 
            width: 150px; height: 150px; border-radius: 50%; 
            border: 4px solid #fff; box-shadow: 0 0 20px #bc13fe, 0 0 40px #bc13fe; 
            margin-bottom: 20px; transition: all 0.5s ease; 
            user-select: none; -webkit-user-drag: none; pointer-events: none; 
        }
        .avatar-wrapper:hover .avatar { transform: scale(1.15) rotate(10deg); box-shadow: 0 0 40px #bc13fe, 0 0 70px #bc13fe; }

        h1 { font-size: 2.2rem; text-shadow: 0 0 10px #fff, 0 0 20px #bc13fe; margin-bottom: 10px; }
        .bio { color: #d1d1d1; font-style: italic; margin-bottom: 20px; }

        /* --- المشغل --- */
        .player-container { background: rgba(0, 0, 0, 0.3); padding: 20px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.1); width: 280px; margin: 0 auto; }
        .song-title { color: #fff; font-size: 0.9rem; font-weight: bold; margin-bottom: 15px; }
        .progress-area { height: 5px; width: 100%; background: #444; border-radius: 5px; cursor: pointer; margin-bottom: 15px; }
        .progress-bar { height: 100%; width: 0%; background: #bc13fe; border-radius: 5px; transition: 0.1s; }
        .controls { display: flex; justify-content: center; gap: 30px; font-size: 1.3rem; color: #bc13fe; }
        .btn { cursor: pointer; transition: 0.3s; }
        .btn:hover { color: #fff; transform: scale(1.2); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="star" style="top: 15%; left: 10%;"></div>
    <div class="star" style="top: 25%; left: 85%;"></div>
    <div class="star" style="top: 60%; left: 15%;"></div>
    <div class="star" style="top: 80%; left: 75%;"></div>
    <div class="star" style="top: 40%; left: 50%;"></div>

    <div class="magic-card">
        <div class="avatar-wrapper">
            <img src="https://img.alfrsantv.com/img/f17780577637631.jpeg" class="avatar" alt="Angy">
        </div>
        <h1>Engy</h1>
        <p class="bio">"روح تعيش بين النجوم، وخيال لا يعرف الحدود.."</p>

        <div class="player-container">
            <div class="song-title" id="songTitle">تحميل...</div>
            <div class="progress-area" id="progressArea">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="controls">
                <i class="fas fa-backward btn" onclick="prevSong()"></i>
                <i class="fas fa-play btn" id="playBtn" onclick="togglePlay()"></i>
                <i class="fas fa-forward btn" onclick="nextSong()"></i>
            </div>
            <audio id="audio"></audio>
        </div>
    </div>

    <script>
        const songs = [
            { title: "سحر النجوم", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { title: "خيال لا ينتهي", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
            { title: "لحن المجرة", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
            { title: "إيقاع الخيال", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
            { title: "همس إنجي", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" }
        ];

        let index = 0;
        const audio = document.getElementById('audio');
        const songTitle = document.getElementById('songTitle');
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');

        function loadSong(i) {
            songTitle.innerText = songs[i].title;
            audio.src = songs[i].src;
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.className = "fas fa-pause btn";
            } else {
                audio.pause();
                playBtn.className = "fas fa-play btn";
            }
        }

        function nextSong() {
            index = (index + 1) % songs.length;
            loadSong(index);
            audio.play();
            playBtn.className = "fas fa-pause btn";
        }

        function prevSong() {
            index = (index - 1 + songs.length) % songs.length;
            loadSong(index);
            audio.play();
            playBtn.className = "fas fa-pause btn";
        }

        audio.addEventListener("timeupdate", (e) => {
            const { currentTime, duration } = e.target;
            progressBar.style.width = `${(currentTime / duration) * 100}%`;
        });

        loadSong(index);
    </script>
</body>
</html>
