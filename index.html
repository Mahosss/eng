<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة شخصية</title>
<style>
    /* ===== Reset ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Cairo', sans-serif; }

    body { background-color: #fff0f5; color: #333; line-height: 1.6; }

    a { text-decoration: none; color: inherit; }

    section { padding: 60px 20px; }

    h1,h2,h3 { margin-bottom: 20px; }

    /* ===== Hero ===== */
    #hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: linear-gradient(135deg, #fce4ec, #f8bbd0);
        text-align: center;
    }

    #hero img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background-color: #ffe4e1; /* مكان الصورة */
        margin-bottom: 20px;
    }

    #hero h1 {
        font-size: 2.5rem;
        color: #c2185b;
    }

    #hero p {
        font-size: 1.2rem;
        color: #880e4f;
    }

    /* ===== About ===== */
    #about {
        background-color: #fff5f8;
        text-align: center;
    }

    #about p {
        max-width: 700px;
        margin: auto;
        font-size: 1.1rem;
    }

    /* ===== Portfolio ===== */
    #portfolio {
        background-color: #fce4ec;
        text-align: center;
    }

    .portfolio-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
        gap: 20px;
        margin-top: 30px;
    }

    .portfolio-item {
        background-color: #fff;
        height: 150px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #c2185b;
        font-weight: bold;
        font-size: 1rem;
    }

    /* ===== Contact ===== */
    #contact {
        background-color: #fff5f8;
        text-align: center;
    }

    #contact form {
        max-width: 500px;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    #contact input, #contact textarea {
        padding: 10px;
        border: 1px solid #c2185b;
        border-radius: 5px;
        font-size: 1rem;
    }

    #contact button {
        padding: 10px;
        border: none;
        border-radius: 5px;
        background-color: #c2185b;
        color: white;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
    }

    #contact button:hover {
        background-color: #880e4f;
    }

    /* ===== Footer ===== */
    footer {
        text-align: center;
        padding: 20px;
        background-color: #f8bbd0;
        color: #880e4f;
    }

    @media (max-width: 600px){
        #hero h1 { font-size: 2rem; }
        #hero p { font-size: 1rem; }
    }
</style>
</head>
<body>

<!-- Hero Section -->
<section id="hero">
    <img alt="صورة شخصية" />
    <h1>اسمك هنا</h1>
    <p>جملة تعريفية عنك</p>
</section>

<!-- About Section -->
<section id="about">
    <h2>عنّي</h2>
    <p>هنا يمكنك كتابة فقرة قصيرة عنك، هواياتك، مهاراتك، وما تحبين تقديمه للزائر.</p>
</section>

<!-- Portfolio Section -->
<section id="portfolio">
    <h2>معرض أعمالي</h2>
    <div class="portfolio-grid">
        <div class="portfolio-item">مشروع 1</div>
        <div class="portfolio-item">مشروع 2</div>
        <div class="portfolio-item">مشروع 3</div>
        <div class="portfolio-item">مشروع 4</div>
    </div>
</section>

<!-- Contact Section -->
<section id="contact">
    <h2>تواصل معي</h2>
    <form>
        <input type="text" placeholder="الاسم" required>
        <input type="email" placeholder="البريد الإلكتروني" required>
        <textarea placeholder="رسالتك" rows="5" required></textarea>
        <button type="submit">إرسال</button>
    </form>
</section>

<!-- Footer -->
<footer>
    &copy; 2026 كل الحقوق محفوظة
</footer>

</body>
</html>
