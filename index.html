<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>engy</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Cairo', sans-serif;
}

body {
  background: #f0f2f5;
  color: #050505;
}

.profile-container {
  max-width: 900px;
  margin: 20px auto;
  background: #fff;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  position: relative;
}

.cover-photo {
  width: 100%;
  height: 250px;
  background: url('https://img.alfrsantv.com/img/f176638904831211.jpg') center/cover no-repeat;
  position: relative;
  border-bottom: 5px solid #ff4fa6;
}

.avatar {
  position: absolute;
  right: 30px;
  bottom: -60px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 4px solid #fff;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  background: #fff;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.5s;
}

.avatar:hover img {
  transform: scale(1.2);
}

.profile-name-container {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 70px;
  margin-right: 30px;
}

.profile-name {
  font-size: 26px;
  font-weight: bold;
  color: #333;
}

.verified {
  color: #1da1f2;
  font-size: 22px;
}

.profile-desc {
  text-align: right;
  font-size: 16px;
  color: #333;
  margin: 10px 30px 20px 30px;
}

.tab-card {
  background: rgba(255,255,255,0.95);
  padding: 15px 20px;
  margin: 0 30px 20px 30px;
  border-radius: 15px;
  border: 1px solid #ddd;
  backdrop-filter: blur(6px);
  text-align: right;
}

.tabs {
  display: flex;
  gap: 15px;
  justify-content: flex-start;
  flex-direction: row-reverse;
}

.tab {
  cursor: pointer;
  padding: 8px 12px;
  font-weight: bold;
  color: #555;
  border-radius: 5px;
  background: #e4e6eb;
  transition: 0.3s;
}

.tab.active {
  background: #d0d2d5;
}

.tab:hover {
  background: #ccc;
}

.tab-content {
  display: none;
  margin-top: 15px;
}

.tab-content.active {
  display: block;
}

.post {
  background: #f0f2f5;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
}

.post img {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 10px;
}

.image-grid {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.image-grid img {
  width: calc(33.33% - 6.66px);
  border-radius: 10px;
}

.reels-grid {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 10px;
  direction: rtl;
}

.reels-grid iframe {
  width: 200px;
  height: 400px;
  border-radius: 15px;
  border: none;
  flex-shrink: 0;
}

@media (max-width: 768px) {
  .avatar {
    right: 20px;
    bottom: -50px;
    width: 100px;
    height: 100px;
  }
  .profile-name-container {
    margin-top: 60px;
    margin-right: 20px;
  }
  .tab-card {
    margin: 0 15px 20px 15px;
    padding: 10px;
  }
  .tab {
    padding: 6px 10px;
    font-size: 14px;
  }
  .reels-grid iframe {
    width: 150px;
    height: 300px;
  }
  .image-grid img {
    width: 100%;
  }
  .tabs {
    flex-wrap: wrap;
    justify-content: flex-start;
  }
}
</style>
</head>
<body>
<div class="profile-container">
  <div class="cover-photo">
    <div class="avatar"><img src="https://img.alfrsantv.com/img/f176543888491621.png"></div>
  </div>

  <div class="profile-name-container">
    <div class="profile-name">𝗘𝑛𝚐𝑦</div>
    <i class="fas fa-circle-check verified"></i>
  </div>
  <div class="profile-desc">ومرة فى العمر يقف الإنسان بجوار أحدهم ولا يود التحرك حتى لوفاته العالم</div>

  <div class="tab-card">
    <div class="tabs">
      <div class="tab active" data-tab="posts">المنشورات</div>
      <div class="tab" data-tab="photos">الصور</div>
      <div class="tab" data-tab="reels">ريلز</div>
    </div>

    <div class="tab-content active" id="posts">
      <div class="post">هذا هو المنشور الأول.</div>
      <div class="post">هذا هو المنشور الثاني.</div>
      <div class="post">هذا هو المنشور الثالث.</div>
    </div>

    <div class="tab-content" id="photos">
      <div class="image-grid">
        <img src="https://picsum.photos/300/200?1" />
        <img src="https://picsum.photos/300/200?2" />
        <img src="https://picsum.photos/300/200?3" />
      </div>
    </div>

    <div class="tab-content" id="reels">
      <div class="reels-grid">
        <iframe src="https://www.youtube.com/embed/DJfC7PTE0_0"></iframe>
        <iframe src="https://www.youtube.com/embed/IZGcNcxgPDI"></iframe>
        <iframe src="https://www.youtube.com/embed/sewClNjqGa8"></iframe>
        <iframe src="https://www.youtube.com/embed/0nURRcxaKXE"></iframe>
        <iframe src="https://www.youtube.com/embed/pPYlntArFqE"></iframe>
      </div>
    </div>

  </div>
</div>
<script>
const tabs = document.querySelectorAll('.tab');
const contents = document.querySelectorAll('.tab-content');
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    contents.forEach(c => c.classList.remove('active'));
    document.getElementById(tab.dataset.tab).classList.add('active');
  });
});
</script>
</body>
</html>
