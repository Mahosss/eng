<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melody</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Tajawal', sans-serif;
}

body{
  background:#f6f4f8;
  color:#333;
}

/* Scroll */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{
  background:linear-gradient(#f2a7c6,#c8b6ff);
  border-radius:10px;
}
::-webkit-scrollbar-track{background:#eee;}

/* Card */
.card{
  max-width:420px;
  margin:30px auto;
  background:#fff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 20px 40px rgba(0,0,0,.12);
}

/* Cover */
.cover{
  height:200px;
  background:url("https://i.imgur.com/8QfQ9ZL.jpg") center/cover no-repeat;
  position:relative;
}

/* Avatar */
.avatar{
  position:absolute;
  bottom:-55px;
  left:50%;
  transform:translateX(-50%);
  width:120px;
  height:120px;
  border-radius:50%;
  background:url("https://i.imgur.com/2yaf2wb.jpg") center/cover no-repeat;
  border:6px solid #fff;
  box-shadow:0 0 30px rgba(242,167,198,.8);
}

/* Content */
.content{
  padding:80px 25px 30px;
  text-align:center;
}

.name{
  font-size:26px;
  font-weight:700;
  margin-bottom:6px;
}

.bio{
  color:#b48ead;
  font-size:14px;
  margin-bottom:30px;
}

/* Info */
.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.box{
  background:#faf7fb;
  padding:14px;
  border-radius:16px;
  font-size:14px;
}

.box i{
  display:block;
  font-style:normal;
  font-size:18px;
  margin-bottom:6px;
}

/* Link style */
a{
  color:inherit;
  text-decoration:none;
}
a:hover{
  text-decoration:underline;
}

/* Mobile */
@media(max-width:480px){
  .card{margin:15px;}
}
</style>
</head>
<body>

<div class="card">

  <div class="cover">
    <div class="avatar"></div>
  </div>

  <div class="content">
    <div class="name">Melody</div>
    <div class="bio">أنثى هادئة بطابع مميز 🌸</div>

    <div class="info">
      <div class="box">
        <i>😊</i>
        المزاج: جيد
      </div>
      <div class="box">
        <i>📖</i>
        الهواية: قراءة
      </div>
      <div class="box">
        <i>🎨</i>
        اللون: لبني
      </div>
      <div class="box">
        <i>💬</i>
        دردشتي:
        <a href="https://xat.me/melody" target="_blank">ميلودى</a>
      </div>
    </div>
  </div>

</div>

</body>
</html>
