<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة شخصية متطورة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&display=swap');

/* ===== Reset ===== */
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(120deg, #ffe4e1, #fff0f5);
    overflow-x: hidden;
    color: #333;
}

/* ===== Animations ===== */
@keyframes floatShape {
    0% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(20px) rotate(15deg); }
    100% { transform: translateY(0) rotate(0deg); }
}

@keyframes fadeInUp {
    0% { opacity:0; transform: translateY(30px); }
    100% { opacity:1; transform: translateY(0); }
}

/* ===== Hero Section ===== */
#hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    position: relative;
    text-align: center;
}

#hero::before, #hero::after {
    content:'';
    position: absolute;
    border-radius: 50%;
    opacity: 0.15;
    animation: floatShape 10s ease-in-out infinite;
}

#hero::before { width: 300px; height: 300px; background:#f8bbd0; top: -80px; left:-60px; }
#hero::after { width: 200px; height: 200px; background:#fce4ec; bottom:-60px; right:-40px; }

#hero img {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 6px solid #fff;
    background-color: #ffe4e1;
    object-fit: cover;
    z-index:1;
    animation: floatShape 6s ease-in-out infinite alternate;
    transition: transform 0.5s;
}

#hero img:hover { transform: scale(1.07) rotate(2deg); }

#hero h1 {
    font-family: 'Pacifico', cursive;
    font-size: 3rem;
    color: #c2185b;
    margin-top: 20px;
    animation: fadeInUp 1.2s ease forwards;
}

#hero p {
    font-size: 1.3rem;
    color: #880e4f;
    max-width: 600px;
    margin-top: 10px;
    animation: fadeInUp 1.5s ease forwards;
}

/* ===== About Section ===== */
#about {
    text-align: center;
    padding: 100px 20px;
    position: relative;
}

#about h2 {
    font-family: 'Pacifico', cursive;
    font-size: 2.2rem;
    color: #c2185b;
    margin-bottom: 25px;
    animation: fadeInUp 1s ease forwards;
}

#about p {
    max-width: 700px;
    margin: auto;
    font-size: 1.15rem;
    line-height: 1.7;
    color: #5a2a46;
    animation: fadeInUp 1.2s ease forwards;
}

/* ===== Optional Personal Traits Section ===== */
#traits {
    background: linear-gradient(120deg,#fce4ec,#fff0f5);
    text-align: center;
    padding: 80px 20px;
}

.trait-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
}

.trait-item {
    background:#fff;
    padding:20px;
    width:160px;
    height:160px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    color:#c2185b;
    font-size:1rem;
    box-shadow:0 8px 15px rgba(0,0,0,0.1);
    transition: transform 0.4s, box-shadow 0.4s;
}

.trait-item:hover {
    transform: translateY(-12px) scale(1.05);
    box-shadow:0 15px 25px rgba(0,0,0,0.2);
}

/* ===== Footer ===== */
footer {
    text-align:center;
    padding:25px;
    background:#f8bbd0;
    color:#880e4f;
    font-weight:bold;
}

/* ===== Responsive ===== */
@media(max-width:600px){
    #hero h1 { font-size:2rem; }
    #hero p { font-size:1rem; }
    .trait-item { width:100%; max-width:250px; }
}
</style>
</head>
<body>

<!-- Hero Section -->
<section id="hero">
    <img alt="صورة شخصية" />
    <h1>اسمك هنا</h1>
    <p>جملة قصيرة تصف شخصيتك بطريقة أنثوية وفنية وجذابة.</p>
</section>

<!-- About Section -->
<section id="about">
    <h2>عنّي</h2>
    <p>فقرة قصيرة توضح شخصيتك، اهتماماتك، هواياتك، وما تحبين أن يعرفه الزائر عنك. يمكن تعديل هذه الفقرة لاحقًا لإضافة أي محتوى تفضليه.</p>
</section>

<!-- Traits / Hobbies Section -->
<section id="traits">
    <h2>هواياتي / صفاتي</h2>
    <div class="trait-grid">
        <div class="trait-item">هواية 1</div>
        <div class="trait-item">هواية 2</div>
        <div class="trait-item">صفة شخصية</div>
        <div class="trait-item">هواية 4</div>
    </div>
</section>

<footer>
    &copy; 2026 كل الحقوق محفوظة
</footer>

</body>
</html>
