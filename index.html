<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kawaii Profile</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Cairo", sans-serif;
}

body{
  background:#f3d7c8;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* Container */
.container{
  width:350px;
  padding:20px;
  text-align:center;
}

/* Bear Image */
.bear{
  width:100%;
  border-radius:20px;
  box-shadow: 10px 10px 20px #d1b2a3,
              -10px -10px 20px #ffffff;
}

/* Time */
.time{
  font-size:40px;
  font-weight:bold;
  margin-top:10px;
  color:#6b4c3b;
}

.date{
  color:#6b4c3b;
  margin-bottom:15px;
}

/* Clock */
.clock{
  width:120px;
  height:120px;
  border-radius:50%;
  margin:15px auto;
  position:relative;
  background:#f3d7c8;
  box-shadow: inset 5px 5px 10px #d1b2a3,
              inset -5px -5px 10px #ffffff;
}

.hand{
  position:absolute;
  bottom:50%;
  left:50%;
  transform-origin:bottom;
  background:#6b4c3b;
}

.hour{
  width:5px;
  height:30px;
}

.min{
  width:3px;
  height:40px;
}

.sec{
  width:2px;
  height:50px;
  background:#ff6b6b;
}

/* Buttons */
.buttons{
  display:flex;
  justify-content:space-around;
  margin-top:20px;
}

.btn{
  width:60px;
  height:60px;
  border-radius:15px;
  background:#f3d7c8;
  box-shadow: 5px 5px 10px #d1b2a3,
              -5px -5px 10px #ffffff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:20px;
  cursor:pointer;
  transition:.3s;
}

.btn:active{
  box-shadow: inset 5px 5px 10px #d1b2a3,
              inset -5px -5px 10px #ffffff;
}
</style>
</head>

<body>

<div class="container">

  <!-- Bear Image -->
  <img src="https://widget-club.com/i/4ee9e42f0df84dce804f" class="bear">

  <!-- Time -->
  <div class="time" id="time">00:00</div>
  <div class="date" id="date">---</div>

  <!-- Clock -->
  <div class="clock">
    <div class="hand hour" id="hour"></div>
    <div class="hand min" id="min"></div>
    <div class="hand sec" id="sec"></div>
  </div>

  <!-- Buttons -->
  <div class="buttons">
    <div class="btn">🐻</div>
    <div class="btn">🍓</div>
    <div class="btn">🎀</div>
    <div class="btn">❤️</div>
  </div>

</div>

<script>
function updateClock(){
  let now = new Date();

  let h = now.getHours();
  let m = now.getMinutes();
  let s = now.getSeconds();

  document.getElementById("time").innerText =
    String(h).padStart(2,'0') + ":" + String(m).padStart(2,'0');

  document.getElementById("date").innerText =
    now.toDateString();

  document.getElementById("hour").style.transform =
    "rotate(" + (h*30 + m/2) + "deg)";

  document.getElementById("min").style.transform =
    "rotate(" + (m*6) + "deg)";

  document.getElementById("sec").style.transform =
    "rotate(" + (s*6) + "deg)";
}

setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
