<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engy | Fantasy Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif;}
body{background:#f5f5f7;color:#333;overflow-x:hidden;}

/* Scrollbar */
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:#f0f0f0;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ff8eb3,#a7c4ff);border-radius:10px;}

/* Cover */
.cover{
  height:300px;
  background:linear-gradient(135deg,#ffdee9,#ccefff);
  position:relative;
  overflow:hidden;
}
.cover::after{
  content:"";
  position:absolute;
  inset:0;
  background:url('https://picsum.photos/1200/600') center/cover no-repeat;
  opacity:0.4;
  filter:blur(2px);
  animation:coverGlow 8s infinite alternate;
}
@keyframes coverGlow{
  0%{filter:blur(2px) brightness(1);}
  50%{filter:blur(3px) brightness(1.1);}
  100%{filter:blur(2px) brightness(1);}
}

/* Profile */
.profile{
  max-width:950px;
  margin:-140px auto 60px;
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(18px);
  border-radius:35px;
  padding:40px;
  box-shadow:0 25px 60px rgba(0,0,0,.15);
  text-align:center;
  position:relative;
}

/* Avatar with 3D Glow */
.avatar-wrap{
  display:flex;
  justify-content:center;
  position:relative;
}
.avatar{
  width:170px;
  height:170px;
  border-radius:50%;
  background:url('https://img.alfrsantv.com/img/f176882709321981.png') center/cover no-repeat;
  margin-top:-90px;
  border:6px solid #fff;
  box-shadow:0 0 35px rgba(255,140,180,0.9),0 0 60px rgba(167,196,255,0.6);
  transition:.5s;
}
.avatar:hover{
  transform:scale(1.08) rotate(3deg);
  box-shadow:0 0 60px rgba(255,140,180,1),0 0 90px rgba(167,196,255,0.8);
}

/* Name */
.profile h1{
  margin-top:15px;
  font-size:36px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}
.profile h1 i{color:#ff6fae;}

/* Username */
.username{color:#888;margin:6px 0 15px;}

/* Bio */
.bio{font-size:16px;line-height:1.8;color:#555;margin-bottom:35px;}

/* Info row - hover reveal */
.info{
  display:flex;
  justify-content:center;
  gap:25px;
  flex-wrap:wrap;
}
.info div{
  background:linear-gradient(145deg,#fff0f5,#dff0ff);
  border-radius:25px;
  padding:20px 18px;
  text-align:center;
  flex:1 1 180px;
  position:relative;
  transition:.4s;
  cursor:pointer;
}
.info div:hover{
  transform:translateY(-5px) scale(1.05);
  box-shadow:0 15px 40px rgba(0,0,0,.2);
}
.info i{font-size:22px;color:#c58fff;margin-bottom:6px;display:block;}
.info a{color:inherit;text-decoration:none;}

/* Posts mosaic */
.posts{
  max-width:950px;
  margin:0 auto 80px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:25px;
}
.post{
  background:linear-gradient(145deg,#ffe6f2,#fbe9ff);
  border-radius:28px;
  padding:25px;
  box-shadow:0 20px 50px rgba(0,0,0,.12);
  transition:.35s;
  position:relative;
  overflow:hidden;
}
.post:hover{
  transform:translateY(-6px) rotate(-1deg);
  box-shadow:0 25px 60px rgba(0,0,0,.18);
}
.post span{font-size:13px;color:#ff6fae;font-weight:700;}
.post h3{margin:10px 0;font-size:20px;}
.post p{font-size:15px;color:#555;line-height:1.8;}

/* Footer */
footer{text-align:center;padding:30px 10px;font-size:14px;}
footer span{color:#ff6fae;font-weight:600;}
footer a{color:#333;text-decoration:none;font-weight:700;}
footer a:active{text-decoration:underline;}

/* Mobile */
@media(max-width:650px){
  .profile{margin:-120px 15px 40px;padding:25px;}
  .info{flex-direction:column;gap:15px;}
}
</style>
</head>
<body>

<div class="cover"></div>

<div class="profile">
  <div class="avatar-wrap">
    <div class="avatar"></div>
  </div>
  <h1>•Engy• <i class="fas fa-check-circle"></i></h1>
  <div class="username">@engy</div>
  <div class="bio">أنثوية، قوية، وملهمة… هذا أنا! 🌸</div>

  <div class="info">
    <div><i class="fa-regular fa-face-smile"></i> المزاج<br><b>جيد</b></div>
    <div><i class="fa-solid fa-book"></i> الهواية<br><b>قراءة</b></div>
    <div><i class="fa-solid fa-palette"></i> اللون<br><b>لبني</b></div>
    <div><i class="fa-solid fa-comments"></i> دردشتي<br><a href="https://xat.me/Melody" target="_blank"><b>ميلودى</b></a></div>
  </div>
</div>

<div class="posts">
  <div class="post"><span>خواطر</span><h3>قوتي</h3><p>أنا قوية لأنني تعلمت كيف أبتسم رغم كل شيء.</p></div>
  <div class="post"><span>إلهام</span><h3>ثقتي</h3><p>ثقتي بنفسي هي سر جمالي الحقيقي.</p></div>
  <div class="post"><span>حياة</span><h3>هدوئي</h3><p>الهدوء لا يعني الضعف، بل يعني السلام الداخلي.</p></div>
</div>

<footer>
  <span>برمجة وتطوير</span>  
  <a href="https://xat.me/oOiiMahmoudiiOo" target="_blank">ζ͜͡Maђϻoud</a>
</footer>

</body>
</html>
