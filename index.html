<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Bear Profile</title>
<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4d6c8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* الكارد */
.card {
    width: 320px;
    background: #f6d8cb;
    border-radius: 30px;
    padding: 20px;
    text-align: center;
    box-shadow: 10px 10px 20px #e0bfb1,
                -10px -10px 20px #fff2ea;
}

/* صورة الدب */
.bear {
    width: 180px;
    height: 180px;
    background: #7b5e57;
    border-radius: 50%;
    margin: auto;
    position: relative;
    box-shadow: inset 5px 5px 10px #6a4f49,
                inset -5px -5px 10px #8c6d65;
}

/* العيون */
.eye {
    width: 10px;
    height: 10px;
    background: black;
    border-radius: 50%;
    position: absolute;
    top: 70px;
}

.eye.left { left: 50px; }
.eye.right { right: 50px; }

/* الأنف */
.nose {
    width: 30px;
    height: 30px;
    background: #d9b1a5;
    border-radius: 50%;
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
}

/* الوقت */
.time {
    font-size: 40px;
    font-weight: bold;
    margin-top: 15px;
    color: #6b4c45;
}

/* التاريخ */
.date {
    color: #8c6d65;
    margin-top: 5px;
}

/* الأزرار */
.buttons {
    margin-top: 20px;
    display: flex;
    justify-content: space-around;
}

.btn {
    width: 50px;
    height: 50px;
    background: #7b5e57;
    border-radius: 15px;
    box-shadow: 5px 5px 10px #6a4f49,
                -5px -5px 10px #8c6d65;
}
</style>
</head>

<body>

<div class="card">

    <div class="bear">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nose"></div>
    </div>

    <div class="time">05:20</div>
    <div class="date">08 / 08 - Wed</div>

    <div class="buttons">
        <div class="btn"></div>
        <div class="btn"></div>
        <div class="btn"></div>
        <div class="btn"></div>
    </div>

</div>

</body>
</html>
