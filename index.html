<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engy Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">

<style>
:root{
--plate-color:#ffffff; /* غيري اللون هنا */
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(to bottom,#e8cfc5,#e3beb3);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:400px;
background:#f3d8cc;
border-radius:35px;
padding:30px 20px 100px;
box-shadow:0 25px 50px rgba(0,0,0,.15);
text-align:center;
position:relative;
overflow:hidden;
}

/* صورة الدبدوب */
.bear-img{
width:300px;
position:relative;
z-index:3;
}

/* اللوح تحت */
.plate{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
width:320px;
height:100px;
background:var(--plate-color);
border-radius:50px;
display:flex;
align-items:center;
justify-content:center;
font-size:36px;
font-weight:bold;
color:#6a463d;
box-shadow:0 10px 25px rgba(0,0,0,.15);
z-index:2;
}

/* الساعة */
.time{
margin-top:20px;
font-size:48px;
color:#6a463d;
font-weight:bold;
}
</style>
</head>
<body>

<div class="card">

<img src="bear.png" class="bear-img">

<div class="plate">Engy</div>

<div class="time" id="clock"></div>

</div>

<script>
function updateClock(){
const now=new Date();
document.getElementById("clock").innerHTML=
now.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
}
setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
